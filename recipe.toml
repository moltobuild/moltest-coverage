# How a consumer compiles moltest-coverage (molto RFC-0009).
schema = 1
form = "source"
kind = "package"
name = "moltest_coverage"
version = "0.2.0"
target = "any"

[artifacts]
type = "source"
std = "c2x"
sources = ["src/collect.c", "src/config.c", "src/gcov_parse.c", "src/position.c",
           "src/register.c", "src/render.c", "src/text.c"]
include = ["include"]
# Interface: the consumer's test binary has to be linked with the coverage
# runtime, because the plugin calls __gcov_dump to flush the counters before
# it reads them. It also instruments tests/, which the report filters out.
# What is measured, src/, is instrumented by the consumer's coverage profile.
flags = ["--coverage"]

[artifacts.private]
defines = ["_DEFAULT_SOURCE", "__USE_MINGW_ANSI_STDIO=1"]
flags = ["--coverage"]

[about]
description = "Code coverage for C and C++ suites run by moltest"
license = "Apache-2.0"
homepage = "https://github.com/moltobuild/moltest-coverage"
