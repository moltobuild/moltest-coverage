# moltest-coverage's own manifest: built and tested with molto.
# Consumers add it with `molto add git+https://github.com/moltobuild/moltest-coverage --dev`.
[package]
name = "moltest_coverage"
version = "0.1.0"
description = "Code coverage for C and C++ suites run by moltest"
repository = "https://github.com/moltobuild/moltest-coverage"
license = "Apache-2.0"
artifact = "static"

[target]
std = "c2x"
requires = ["attr_nodiscard"]
defines = ["_DEFAULT_SOURCE", "__USE_MINGW_ANSI_STDIO=1"]
include = ["include"]
flags = ["-Wall", "-Wextra", "-Wpedantic"]

[test]
mode = "single"

# A runtime dependency, not a development one: src/ registers a moltest
# reporter, and molto keeps [dev-deps] headers out of src/. How a consumer's
# own moltest and this one stay a single version is an open question
# (docs/ARCHITECTURE.md).
[deps]
moltest = { git = "https://github.com/moltobuild/moltest", branch = "master" }

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 3
debug_info = false
